version: "3.1"

services:
  masterplan-slack:
    image: masterplan-slack
    build: .
    environment:
      - SLACK_TOKEN_MUNBW=${SLACK_TOKEN_MUNBW}
      - SLACK_TOKEN_MUNBB=${SLACK_TOKEN_MUNBB}
      - SLACK_TOKEN_MUNSH=${SLACK_TOKEN_MUNSH}
      - SLACK_TOKEN_DMUN=${SLACK_TOKEN_DMUN}
      - TEST_CHANNEL_MUNBW=${TEST_CHANNEL_MUNBW}
      - TEST_CHANNEL_MUNBB=${TEST_CHANNEL_MUNBB}
      - TEST_CHANNEL_MUNSH=${TEST_CHANNEL_MUNSH}
      - TEST_CHANNEL_DMUN=${TEST_CHANNEL_DMUN}
      - AUTH_EMAIL_HEADER=${AUTH_EMAIL_HEADER:-X-Forwarded-User}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-masterplan}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-masterplan}
      - TZ=Europe/Berlin
    ports:
      - 8080:8888
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=${DB_NAME:-masterplan}
      - MYSQL_USER=${DB_USER:-masterplan}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - masterplan-mysql:/var/lib/mysql

volumes:
  masterplan-mysql:
